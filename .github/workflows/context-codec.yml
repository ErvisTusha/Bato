name: Rust codec validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  codec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Validate Python tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Exercise the Bato release CLI
        run: python3 scripts/run_tests.py --bato-bin target/release/bato

  portable-paths:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Verify portable archive paths
        run: python scripts/run_tests.py --bato-bin target/release/${{ runner.os == 'Windows' && 'bato.exe' || 'bato' }} --timeout 180 --test test_portable_unicode_and_deep_paths
