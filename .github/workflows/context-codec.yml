name: Rust codec validation

on:
  push:
    branches:
      - main
      - claude/focused-faraday-t2c712
  pull_request:

jobs:
  codec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Validate Python tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Exercise the Bato release CLI
        run: python3 scripts/run_tests.py --bato-bin target/release/bato

  cpu-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --release --all-targets --no-default-features --locked
      - run: cargo build --release --no-default-features --locked
      - name: Verify CPU-only archive round trips
        run: python3 scripts/run_tests.py --bato-bin target/release/bato --timeout 180

  native-feature-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --features hip
      - run: cargo check --locked --all-targets --features level-zero
      - run: cargo check --locked --all-targets --features metal
      - run: cargo clippy --release --all-targets --locked --features hip,level-zero,metal -- -D warnings
      - run: cargo test --release --locked --features hip,level-zero,metal
      - name: Verify native plugin ABI can be compiled as C and C++
        run: |
          cc -x c -fsyntax-only native/include/bato_gpu_backend.h
          c++ -x c++ -fsyntax-only native/include/bato_gpu_backend.h

  apple-metal-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build direct Metal plugin with Xcode
        run: bash scripts/build_native_backends.sh metal
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --features metal

  portable-paths:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Verify portable archive paths
        run: python scripts/run_tests.py --bato-bin target/release/${{ runner.os == 'Windows' && 'bato.exe' || 'bato' }} --timeout 180 --test test_portable_unicode_and_deep_paths
