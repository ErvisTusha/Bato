name: Rust codec validation

on:
  push:
    branches:
      - main
      - claude/focused-faraday-t2c712
  pull_request:

# A newer push/PR supersedes older runs of this workflow on the same branch.
# Include the workflow name so separate workflows on the latest SHA can
# complete concurrently rather than cancelling one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  codec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python3 scripts/check_universal_features.py
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Validate Python tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Exercise the Bato release CLI
        run: python3 scripts/run_tests.py --self-contained --bato-bin target/release/bato

  cpu-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --release --all-targets --no-default-features --locked
      - run: cargo build --release --no-default-features --locked
      - name: Verify CPU-only archive round trips
        run: python3 scripts/run_tests.py --self-contained --bato-bin target/release/bato --timeout 180

  isolated-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, wgpu, hip, level-zero, metal]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check standalone backend compile
        run: cargo check --all-targets --locked --no-default-features --features ${{ matrix.backend }}
      - name: Lint standalone backend
        run: cargo clippy --all-targets --locked --no-default-features --features ${{ matrix.backend }} -- -D warnings
      - name: Run standalone backend tests
        run: cargo test --locked --no-default-features --features ${{ matrix.backend }}

  native-feature-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --no-default-features --features hip
      - run: cargo check --locked --all-targets --no-default-features --features level-zero
      - run: cargo check --locked --all-targets --no-default-features --features metal
      - run: cargo clippy --release --all-targets --locked --no-default-features --features hip,level-zero,metal -- -D warnings
      - run: cargo test --release --locked --no-default-features --features hip,level-zero,metal
      - name: Compile reference native ABI fixture (test-only)
        run: |
          mkdir -p target/native
          cc -O2 -fPIC -shared native/reference/test_abi.c -o target/native/libbato_test_abi.so
      - name: Verify native C ABI and byte parity for all five filters
        env:
          BATO_TEST_NATIVE_PLUGIN: "1"
          BATO_HIP_LIBRARY: ${{ github.workspace }}/target/native/libbato_test_abi.so
        run: cargo test --release --locked --no-default-features --features hip native_plugin_fixture_matches_cpu_filter_and_inverse -- --nocapture
      - name: Verify native plugin embedded inside a single executable
        env:
          BATO_BUNDLE_HIP_LIBRARY: ${{ github.workspace }}/target/native/libbato_test_abi.so
          BATO_TEST_NATIVE_PLUGIN: '1'
        run: cargo test --release --locked --no-default-features --features hip native_plugin_fixture_matches_cpu_filter_and_inverse -- --nocapture
      - name: Verify native plugin ABI can be compiled as C and C++
        run: |
          cc -x c -fsyntax-only native/include/bato_gpu_backend.h
          c++ -x c++ -fsyntax-only native/include/bato_gpu_backend.h

  apple-metal-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build direct Metal plugin with Xcode
        run: bash scripts/build_native_backends.sh metal
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --no-default-features --features metal

  portable-paths:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Verify portable archive paths
        run: python scripts/run_tests.py --bato-bin target/release/${{ runner.os == 'Windows' && 'bato.exe' || 'bato' }} --timeout 180 --test test_portable_unicode_and_deep_paths
