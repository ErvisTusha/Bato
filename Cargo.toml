[package]
name = "bato-engine"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
authors = ["Bato Research Team"]
description = "Bato: a pure-Rust lossless context-mixing compressor"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["compression", "lossless", "context-mixing", "rust"]
categories = ["compression", "algorithms"]

[dependencies]
sha2 = "0.10"
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
same-file = "1"
serde_json = "1"
age = { version = "0.11.1", default-features = false }
reed-solomon-erasure = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }


[[bin]]
name = "bato"
path = "src/main.rs"

[lib]
name = "bato_engine"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 3
overflow-checks = true
